name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app (single file for GAS)
        run: npm run build:gas

      - name: Setup clasp credentials
        run: |
          echo '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json

      - name: Push to Google Apps Script
        working-directory: ./backend
        run: npx @google/clasp push --force

      - name: Deploy (update existing deployment)
        working-directory: ./backend
        run: |
          npx @google/clasp deploy -i "${{ secrets.GAS_DEPLOYMENT_ID }}" -d "Auto-deploy from GitHub $(date +'%Y-%m-%d %H:%M:%S')"
